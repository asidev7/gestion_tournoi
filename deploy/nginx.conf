# Config Nginx pour tournoi-adeib.site
# À copier dans /etc/nginx/sites-available/tournoi-adeib
# Puis : ln -s /etc/nginx/sites-available/tournoi-adeib /etc/nginx/sites-enabled/
#
# NOTE : ce fichier ne gère que le HTTP (port 80).
# Le bloc HTTPS (port 443) et la redirection seront ajoutés AUTOMATIQUEMENT
# par certbot lors de l'étape SSL. Ne pas écrire le bloc 443 à la main.

server {
    listen 80;
    listen [::]:80;
    server_name tournoi-adeib.site www.tournoi-adeib.site;

    client_max_body_size 25M;

    # Fichiers statiques (collectés par collectstatic)
    location /static/ {
        alias /var/www/tournoi-adeib/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Fichiers médias (uploads : logos, photos, QR codes)
    location /media/ {
        alias /var/www/tournoi-adeib/media/;
        expires 30d;
        access_log off;
    }

    # Application Django via Gunicorn (socket Unix)
    location / {
        proxy_pass http://unix:/run/gunicorn-tournoi.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
